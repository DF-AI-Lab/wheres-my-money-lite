# Deploys the Claude MCP Worker (worker/) to Cloudflare from GitHub, so no computer is needed.
# Repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, GOOGLE_CLIENT_SECRET, TOKEN_SECRET, ALLOWED_EMAILS
name: Deploy Worker
on:
  workflow_dispatch:
  push:
    branches: [claude/cool-bell-u4q8y8, main]
    paths: ['worker/**', '.github/workflows/deploy-worker.yml']
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Worker tests
        run: node --test worker/test/*.test.js
      # Pasted secrets often carry a stray space or line break: strip them, show only the length.
      - name: Clean Cloudflare secrets
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          t=$(printf '%s' "$T" | tr -d '[:space:]'); a=$(printf '%s' "$A" | tr -d '[:space:]')
          echo "::add-mask::$t"
          echo "Token length: ${#t}. Account ID length: ${#a} (should be 32)"
          echo "CF_TOKEN=$t" >> "$GITHUB_ENV"
          echo "CF_ACCOUNT=$a" >> "$GITHUB_ENV"
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CF_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT }}
          workingDirectory: worker
          secrets: |
            GOOGLE_CLIENT_SECRET
            TOKEN_SECRET
            ALLOWED_EMAILS
        env:
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
          ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
